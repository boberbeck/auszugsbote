name: Tests & Docker-Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Docker Hub nur, wenn die Secrets DOCKERHUB_USERNAME und DOCKERHUB_TOKEN gesetzt sind.
      - name: Ziele bestimmen
        id: ziele
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          images="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -n "$DH_USER" ]; then
            images="${images}"$'\n'"docker.io/${DH_USER}/auszugsbote"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          fi
          { echo "images<<EOF"; echo "$images"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ziele.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main

      - name: Login GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Docker Hub
        if: github.event_name != 'pull_request' && steps.ziele.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: README nach Docker Hub übernehmen
        if: startsWith(github.ref, 'refs/tags/v') && steps.ziele.outputs.dockerhub == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/auszugsbote
          short-description: "Holt Kontoauszüge per FinTS automatisch ab und legt sie in einem freigegebenen Ordner ab."
          readme-filepath: ./README.md
