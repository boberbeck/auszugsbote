{% from "_macros.html" import icon, logo %}<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{% endblock %} · Auszugsbote</title><link rel="stylesheet" href="/static/app.css"></head>
<body><div class="auth"><div>
  <div class="brand">{{ logo() }}<div><b>Auszugsbote</b><small>Kontoauszüge per FinTS</small></div></div>
  <div class="card"><div class="bd" style="padding:22px">
    {% if errors %}<div class="flash err" style="flex-direction:column;align-items:flex-start">{% for e in errors %}<div>{{ e }}</div>{% endfor %}</div>{% endif %}
    {% if error %}<div class="flash err">{{ icon("warn") }}{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </div></div>
</div></div></body></html>
