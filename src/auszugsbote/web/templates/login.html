{% extends "auth_base.html" %}{% block title %}Anmelden{% endblock %}
{% block content %}
<h1 style="font-size:20px;margin-bottom:16px">Anmelden</h1>
<form method="post" action="/login" class="stack" style="gap:14px">
  <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="{{ next }}">
  <div><label class="f">Passwort</label><input class="inp" type="password" name="password" autocomplete="current-password" autofocus required></div>
  <button class="btn pri" style="justify-content:center">Anmelden</button>
</form>
{% endblock %}
