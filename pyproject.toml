[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "auszugsbote"
version = "0.1.0"
description = "Holt Kontoauszüge per FinTS automatisch ab und legt sie in einem freigegebenen Ordner ab."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fints==5.0.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1",
  "cryptography>=42",
  "argon2-cffi>=23.1",
  "apscheduler>=3.10,<4",
  "pyyaml>=6",
  "pydantic>=2.6",
  "httpx>=0.27",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
auszugsbote = "auszugsbote.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auszugsbote = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
